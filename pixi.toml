[workspace]
name = "rads-bacteroidota"
version = "1.0.0"
description = "RADS Bacteroidota defense system analysis results and dashboard"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"

[feature.dashboard.dependencies]
shiny = ">=0.6"
plotly = ">=5.0"
numpy = ">=1.24"
pandas = ">=1.5"
polars = ">=0.20"
pyarrow = ">=14.0"

[environments]
default = ["dashboard"]

[tasks]
dashboard = "shiny run dashboard/app.py --reload --host 0.0.0.0 --port 8000"
dashboard-hpc = "shiny run dashboard/app.py --host 0.0.0.0 --port 8000"
