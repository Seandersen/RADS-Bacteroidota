name: rads
channels:
  - conda-forge
dependencies:
  - python>=3.10

  # Dashboard dependencies
  - shiny                  # Web dashboard framework
  - plotly                 # Interactive plots
  - polars                 # Fast dataframes
  - pyarrow                # Required by polars for to_pandas() conversion
  - numpy                  # Required by plotly
  - pandas                 # Required for plotly express and to_pandas()
